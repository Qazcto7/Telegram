name: Build Telegram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        run: |
          SDKMANAGER=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" >> local.properties
          fi
          cat local.properties

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Configure Swap & Memory
        run: |
          sudo fallocate -l 6G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC"

      - name: Prepare APK for Direct Download
        run: |
          mkdir -p release_apk
          APK_PATH=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" ! -name "*unaligned*" | head -n 1)
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" release_apk/Telegram-Custom.apk
          ls -lh release_apk/Telegram-Custom.apk

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Telegram Custom APK (Doğrudan İndirme)"
          body: |
            ### 🚀 Telegram Custom APK Doğrudan İndirme
            Zip açmaya gerek kalmadan doğrudan cihazınıza yükleyin:
            - **[Telegram-Custom.apk](https://github.com/${{ github.repository }}/releases/download/latest/Telegram-Custom.apk)**
          files: release_apk/Telegram-Custom.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-Custom-APK
          path: release_apk/Telegram-Custom.apk
          if-no-files-found: warn
