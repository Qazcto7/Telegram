name: Build Telegram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        run: |
          SDKMANAGER=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" >> local.properties
          fi
          cat local.properties

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Configure Swap & Memory
        run: |
          sudo fallocate -l 6G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-Custom-APK
          path: |
            TMessagesProj_App/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
